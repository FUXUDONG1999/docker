version: '3.8'

networks:
  pulsar-net:
    driver: bridge

services:
  # ZooKeeper - Pulsar 元数据存储
  zookeeper:
    image: apachepulsar/pulsar:3.3.4
    container_name: pulsar-zookeeper
    ports:
      - "2181:2181"
    volumes:
      - /root/data/pulsar/zookeeper/data:/pulsar/data/zookeeper
    environment:
      - metadataStoreUrl=zk:zookeeper:2181
      - PULSAR_MEM=-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m
    networks:
      - pulsar-net
    user: "0:0"
    command: >
      bash -c "chown -R 10000:0 /pulsar/data/zookeeper &&
      chmod -R 775 /pulsar/data/zookeeper &&
      bin/apply-config-from-env.py conf/zookeeper.conf &&
      bin/generate-zookeeper-config.sh conf/zookeeper.conf &&
      exec bin/pulsar zookeeper"
    healthcheck:
      test: [ "CMD", "bin/pulsar-zookeeper-ruok.sh" ]
      interval: 10s
      timeout: 5s
      retries: 30

  # 初始化集群元数据（一次性任务）
  pulsar-init:
    image: apachepulsar/pulsar:3.3.4
    container_name: pulsar-init
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - pulsar-net
    command: >
      bin/pulsar initialize-cluster-metadata
      --cluster pulsar-cluster
      --zookeeper zookeeper:2181
      --configuration-store zookeeper:2181
      --web-service-url http://broker:8080
      --broker-service-url pulsar://broker:6650

  # BookKeeper - 消息持久化存储
  bookie:
    image: apachepulsar/pulsar:3.3.4
    container_name: pulsar-bookie
    ports:
      - "3181:3181"
    volumes:
      - /root/data/pulsar/bookie/data:/pulsar/data/bookkeeper
    environment:
      - clusterName=pulsar-cluster
      - zkServers=zookeeper:2181
      - metadataServiceUri=metadata-store:zk:zookeeper:2181
      - advertisedAddress=bookie
      - BOOKIE_MEM=-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m
    depends_on:
      zookeeper:
        condition: service_healthy
      pulsar-init:
        condition: service_completed_successfully
    networks:
      - pulsar-net
    user: "0:0"
    command: >
      bash -c "chown -R 10000:0 /pulsar/data/bookkeeper &&
      chmod -R 775 /pulsar/data/bookkeeper &&
      bin/apply-config-from-env.py conf/bookkeeper.conf &&
      exec bin/pulsar bookie"
    healthcheck:
      test: [ "CMD", "bin/bookkeeper", "shell", "bookiesanity" ]
      interval: 10s
      timeout: 5s
      retries: 30

  # Broker - Pulsar 消息代理
  broker:
    image: apachepulsar/pulsar:3.3.4
    container_name: pulsar-broker
    ports:
      - "6650:6650"
      - "9099:8080"
    volumes:
      - /root/data/pulsar/broker/logs:/pulsar/logs
    environment:
      - metadataStoreUrl=zk:zookeeper:2181
      - zookeeperServers=zookeeper:2181
      - clusterName=pulsar-cluster
      - managedLedgerDefaultEnsembleSize=1
      - managedLedgerDefaultWriteQuorum=1
      - managedLedgerDefaultAckQuorum=1
      - advertisedAddress=broker
      - advertisedListeners=external:pulsar://127.0.0.1:6650
      - PULSAR_MEM=-Xms512m -Xmx512m -XX:MaxDirectMemorySize=256m
    depends_on:
      zookeeper:
        condition: service_healthy
      bookie:
        condition: service_healthy
    networks:
      - pulsar-net
    user: "0:0"
    command: >
      bash -c "chown -R 10000:0 /pulsar/logs &&
      chmod -R 775 /pulsar/logs &&
      bin/apply-config-from-env.py conf/broker.conf &&
      exec bin/pulsar broker"
    healthcheck:
      test: [ "CMD", "bin/pulsar-admin", "brokers", "healthcheck" ]
      interval: 10s
      timeout: 5s
      retries: 30

  # Pulsar Manager - Web 管理控制台
  pulsar-manager:
    image: apachepulsar/pulsar-manager:latest
    container_name: pulsar-manager
    ports:
      - "9527:9527"
      - "7750:7750"
    environment:
      - SPRING_CONFIGURATION_FILE=/pulsar-manager/pulsar-manager/application.properties
    depends_on:
      broker:
        condition: service_healthy
    networks:
      - pulsar-net
